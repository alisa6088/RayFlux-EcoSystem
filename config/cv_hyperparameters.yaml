# ==============================================================================
# RayFlux Section 2: Multi-Modal Rooftop Object Detection Hyperparameters
# ==============================================================================

chromaticity:
  cyan_index_thresh: 0.04
  bright_metal_percentile: 88.0
  min_cooler_saturation: 0.08

glcm_texture:
  window_size: 5
  quantization_levels: 32
  distance: 1
  angles_deg: [0, 45, 90, 135]
  contrast_obj_thresh: 20.0
  homogeneity_shadow_thresh: 0.65

gabor_bank:
  orientations_deg: [0, 45, 90, 135]
  wavelength_px: 4.0
  sigma_px: 2.0
  spatial_aspect_ratio: 0.5
  energy_percentile_thresh: 80.0

morphology:
  tophat_disk_radius_px: 5
  blackhat_disk_radius_px: 4
  closing_kernel_px: 3
  opening_kernel_px: 2

shadow_disambiguation:
  relative_lum_low_ratio: 0.62
  relative_lum_high_ratio: 0.75
  max_shadow_glcm_contrast: 16.0
  min_shadow_homogeneity: 0.60

obia_geometry:
  min_obstacle_area_m2: 0.20
  max_obstacle_roof_fraction: 0.45
  min_usable_patch_area_m2: 2.00
  penthouse_min_area_m2: 6.00
  cooler_max_area_m2: 6.00
  chimney_max_area_m2: 1.20
